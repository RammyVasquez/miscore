<!doctype html>
<html lang="es" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EDF0EA; --surf:#FFFFFF; --surf2:#F4F6F2; --ink:#15231F; --mut:#5B6B65; --line:#D8DFD7;
  --pri:#1D4ED8; --pri-ink:#FFFFFF; --lib:#F5B700; --lib-ink:#241B00;
  --ok:#13795B; --bad:#C2352B; --warn:#B45309;
  --k-gas:#B45309; --k-tar:#1D4ED8; --k-met:#13795B; --k-die:#7C3AED; --k-pag:#5B6B65;
  --font-d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --font-b:'Figtree','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surf:#16211D; --surf2:#1C2924; --ink:#E7EEE9; --mut:#9AAAA3; --line:#2A3A34;
    --pri:#7C98FF; --pri-ink:#0B1020; --lib:#F5B700; --lib-ink:#241B00;
    --ok:#3DD3A0; --bad:#FF7A70; --warn:#F0B35A;
    --k-gas:#F0B35A; --k-tar:#7C98FF; --k-met:#3DD3A0; --k-die:#B79CFF; --k-pag:#9AAAA3;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surf:#16211D; --surf2:#1C2924; --ink:#E7EEE9; --mut:#9AAAA3; --line:#2A3A34;
  --pri:#7C98FF; --pri-ink:#0B1020; --lib:#F5B700; --lib-ink:#241B00;
  --ok:#3DD3A0; --bad:#FF7A70; --warn:#F0B35A;
  --k-gas:#F0B35A; --k-tar:#7C98FF; --k-met:#3DD3A0; --k-die:#B79CFF; --k-pag:#9AAAA3;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-b);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-d);margin:0;line-height:1.1;letter-spacing:-.01em}
.mut{color:var(--mut)} .grow{flex:1;min-width:0}
.shell{max-width:1100px;margin:0 auto;padding:14px 16px 110px}
.side{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}
.top h1{font-size:28px;font-weight:800}
.sync{font-size:12.5px;color:var(--mut);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}
.sync.cloud i{background:var(--ok)} .sync.error i{background:var(--bad)}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.panel h2{font-size:19px;font-weight:700;margin-bottom:10px}
.panel .head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.panel .head h2{margin:0}
.hero{background:var(--lib);color:var(--lib-ink);border-radius:28px;padding:22px 22px 20px;margin-bottom:16px}
.hero .lbl{font-weight:600;font-size:15px;opacity:.85}
.hero .big{font-family:var(--font-d);font-weight:800;font-size:clamp(46px,13vw,76px);line-height:1;letter-spacing:-.03em;margin:6px 0 4px}
.hero .sub{font-size:15px;font-weight:500}
.hero dl{display:flex;flex-wrap:wrap;gap:6px 22px;margin:16px 0 0;padding-top:14px;border-top:1.5px solid rgba(36,27,0,.25)}
.hero dt{font-size:12.5px;opacity:.8} .hero dd{margin:0;font-weight:700;font-size:16px}
.hero.neg{background:var(--bad);color:#fff} .hero.neg dl{border-top-color:rgba(255,255,255,.4)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row .nm{font-weight:600}
.row .sb{font-size:13.5px;color:var(--mut)}
.amt{font-weight:700;font-family:var(--font-d);font-size:17px;white-space:nowrap}
.amt.pos{color:var(--ok)} .amt.neg{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surf2);border:1px solid var(--line);color:var(--mut);vertical-align:middle;margin-left:6px}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.bar{height:8px;border-radius:99px;background:var(--surf2);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bar.ok>i{background:var(--ok)} .bar.bad>i{background:var(--bad)} .bar.warn>i{background:var(--warn)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;cursor:pointer;padding:0;color:transparent}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chk svg{width:16px;height:16px}
.pen{color:var(--mut);display:grid;flex:none}.pen svg{width:17px;height:17px}
.btn{background:var(--pri);color:var(--pri-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:42px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px;border-radius:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.icon{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surf);cursor:pointer;font-size:22px;line-height:1}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.qnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.qnav>div{text-align:center;display:flex;flex-direction:column}
.qnav b{font-family:var(--font-d);font-size:19px}
.inc{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.inc input{width:130px;text-align:right;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surf2);font-weight:700}
.cols{display:grid;gap:14px}
.card-row{border-left:6px solid var(--pri);border-radius:6px 18px 18px 6px}
.kv{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:14px;color:var(--mut);margin-top:6px}
.kv b{color:var(--ink)}
.due-soon{color:var(--bad);font-weight:700}
.hb{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.hb .ht{height:12px;background:var(--surf2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.hb .ht i{display:block;height:100%;background:var(--pri)}
.hb .hv{font-weight:700;min-width:64px;text-align:right}
.empty{text-align:center;color:var(--mut);padding:22px 8px}
.date-h{font-size:13px;font-weight:700;color:var(--mut);margin:14px 0 2px}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--pri);color:var(--pri-ink);border:0;border-radius:18px;padding:0 18px;height:52px;font-weight:800;cursor:pointer;z-index:20;display:flex;align-items:center;gap:8px}
.fab svg{width:20px;height:20px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surf);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
.tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--mut);padding:6px 0;cursor:pointer;border-radius:12px}
.tabbar button svg{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--pri)}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu-list button{display:flex;width:100%;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;font-weight:600;font-size:16px;cursor:pointer;text-align:left}
.menu-list svg{width:24px;height:24px;color:var(--pri)}
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.55);z-index:50}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--surf);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:51}
.sheet h2{font-size:22px;margin-bottom:12px}
.fld{margin-bottom:12px;display:flex;flex-direction:column;gap:5px}
.fld label{font-size:14px;font-weight:600}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line);background:var(--surf2);border-radius:12px;padding:11px 12px;width:100%}
.fld small,.hint{color:var(--mut);font-size:13px;margin:0 0 10px}
.err{color:var(--bad);font-weight:600;margin:4px 0 8px}
.sheet-actions{display:flex;gap:8px;align-items:center;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;font-size:14px;max-width:90vw}
.c6{width:100%;height:auto;display:block}
.c6 text{fill:var(--mut);font-size:12px;font-family:var(--font-b)}
.b-ing{fill:var(--pri)} .b-gas{fill:var(--bad)} .b-aho{fill:var(--ok)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.welcome{max-width:560px;margin:8vh auto 0;text-align:left}
.welcome h1{font-size:40px;font-weight:800;margin-bottom:12px}
.welcome p{color:var(--mut);font-size:17px}
.welcome .btns{flex-direction:column}
.welcome .btn{padding:14px 18px}
@media (min-width:700px){
  .sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:24px}
  .cols.two{grid-template-columns:1fr 1fr;align-items:start}
}
@media (min-width:860px){
  .shell{display:grid;grid-template-columns:210px 1fr;gap:34px;padding:30px 28px 60px}
  .side{display:flex;flex-direction:column;gap:3px;position:sticky;top:30px;align-self:start}
  .side .brand{font-family:var(--font-d);font-weight:800;font-size:24px;margin-bottom:16px}
  .side button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--mut);cursor:pointer;text-align:left}
  .side button svg{width:21px;height:21px}
  .side button[aria-current="page"]{background:var(--surf);color:var(--pri);border:1px solid var(--line)}
  .tabbar{display:none}
  .fab{bottom:28px;right:32px}
  .toast{bottom:28px}
}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{opacity:0;margin-top:14px}to{opacity:1;margin-top:0}} }
</style>
</head>
<body>
<div class="shell" id="app">
  <aside class="side" id="side"></aside>
  <main id="view"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
<div id="fabroot"></div>
<div id="sheet-root"></div>
<div id="toast-root"></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid8=()=>Math.random().toString(36).slice(2,9);
const round2=x=>Math.round((+x||0)*100)/100;
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[^0-9.,\-]/g,'').replace(',','.'));return isNaN(n)?0:n};
const MX0=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:0,maximumFractionDigits:0});
const MX2=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>{n=+n||0;return Math.abs(n%1)<0.005?MX0.format(Math.round(n)):MX2.format(n)};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ymOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const lastDay=(y,m)=>new Date(y,m,0).getDate();
const parseYM=ym=>{const p=ym.split('-').map(Number);return {y:p[0],m:p[1]}};
const addMonths=(ym,n)=>{const p=parseYM(ym);return ymOf(new Date(p.y,p.m-1+n,1))};
const fmtDate=s=>{const p=s.split('-').map(Number);return p[2]+' '+MES3[p[1]-1]};
const stable=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const clean=o=>JSON.parse(JSON.stringify(o));
function midnight(){const t=new Date();t.setHours(0,0,0,0);return t}
function nextOcc(day){const t=midnight();let y=t.getFullYear(),m=t.getMonth();for(let i=0;i<4;i++){const d=Math.min(day,lastDay(y,m+1));const c=new Date(y,m,d);if(c>=t)return c;m++;if(m>11){m=0;y++}}return t}
const daysTo=d=>Math.round((d-midnight())/86400000);
const inDays=d=>d===0?'hoy':d===1?'mañana':'en '+d+' días';
const fdate=d=>d.getDate()+' '+MES3[d.getMonth()];

const ICONS={
  resumen:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  quincena:'<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 3v3M16 3v3"/>',
  gastos:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  tarjetas:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h4"/>',
  metas:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/>',
  fijos:'<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 014-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 01-4 4H4"/>',
  reportes:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  ajustes:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  mas:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'
};
const ic=n=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>';

/* ---------- estado ---------- */
const LS='mis-finanzas-v1';
let S={config:null,months:{}};
const dirty={cfg:false,months:new Set()};
const DB={db:null,base:null,first:false};
let syncMode='local';
let pendingRender=false;
const typing=()=>{const a=document.activeElement;return !!(a&&a.matches&&a.matches('#view input,#view select,#view textarea'))};
const blankConfig=()=>({onboarded:false,ingresoQ:0,tarjetas:[],fijos:[],metas:[],plantilla:[],cats:['Mandado','Salidas','Gasolina','Salud','Hogar','Servicios','Compras','Otros']});
function loadLocal(){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);S.config=Object.assign(blankConfig(),o.config);S.months=o.months||{};return}}catch(e){}S.config=blankConfig();S.months={}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({config:S.config,months:S.months}))}catch(e){}}
let pt=null;
function schedulePersist(){saveLocal();clearTimeout(pt);pt=setTimeout(persist,500)}
const touchCfg=()=>{dirty.cfg=true;schedulePersist()};
const touchMonth=ym=>{dirty.months.add(ym);schedulePersist()};
async function persist(){
  if(!DB.db||!DB.base)return;
  try{
    if(dirty.cfg){dirty.cfg=false;try{await DB.db.doc(DB.base+'/config').set(clean(S.config))}catch(e){dirty.cfg=true;throw e}}
    for(const ym of Array.from(dirty.months)){dirty.months.delete(ym);try{await DB.db.doc(DB.base+'/m-'+ym).set(clean(S.months[ym]||{tx:[]}))}catch(e){dirty.months.add(ym);throw e}}
    setStatus('cloud');
  }catch(e){setStatus('error')}
}
function setStatus(m){syncMode=m;const el=document.querySelector('.sync');if(el){el.className='sync '+m;el.querySelector('span').textContent=statusText()}}
const statusText=()=>syncMode==='cloud'?'Sincronizado en tu cuenta':syncMode==='error'?'No se pudo sincronizar; guardado en este dispositivo':'Guardado en este dispositivo';

async function initCloud(){
  try{
    if(!window.claude||!window.claude.use){return}
    const r=await Promise.all([claude.use('db'),claude.use('user')]);
    const db=r[0],user=r[1];
    if(!db||!user)return;
    const id=await user.id();
    if(!id)return;
    DB.db=db;DB.base='data/users/'+id;
    db.collection(DB.base).onSnapshot(onSnap,()=>setStatus('local'));
  }catch(e){setStatus('local')}
}
function onSnap(snap){
  const cfgDoc=snap.docs.find(d=>d.id==='config');
  if(!DB.first){
    if(snap.metadata.fromCache)return;
    DB.first=true;
    if(!cfgDoc){
      if(S.config.onboarded){dirty.cfg=true;Object.keys(S.months).forEach(k=>dirty.months.add(k));schedulePersist()}
      setStatus('cloud');render();return;
    }
  }
  if(snap.metadata.hasPendingWrites){setStatus('cloud');return}
  let changed=false;
  snap.docs.forEach(d=>{
    const id=d.id,data=d.data();
    if(id==='config'){
      if(!dirty.cfg){const nc=Object.assign(blankConfig(),data);if(stable(nc)!==stable(S.config)){S.config=nc;changed=true}}
    }else if(id.indexOf('m-')===0){
      const ym=id.slice(2);
      if(!dirty.months.has(ym)&&stable(data)!==stable(S.months[ym]||null)){S.months[ym]=data;changed=true}
    }
  });
  setStatus('cloud');
  if(changed){saveLocal();if(SH||typing())pendingRender=true;else render()}
}

/* ---------- lógica ---------- */
const getMonth=ym=>{if(!S.months[ym])S.months[ym]={tx:[]};if(!S.months[ym].tx)S.months[ym].tx=[];return S.months[ym]};
const roMonth=ym=>S.months[ym]||{tx:[]};
function getQ(ym,n){
  const mo=getMonth(ym),k='q'+n;
  if(!mo[k]){mo[k]={ingreso:S.config.ingresoQ||0,allocs:S.config.plantilla.map(p=>Object.assign({},p,{id:uid8(),done:false}))};touchMonth(ym)}
  return mo[k];
}
const qBounds=(ym,n)=>{const p=parseYM(ym);return n===1?[ym+'-01',ym+'-15']:[ym+'-16',ym+'-'+pad(lastDay(p.y,p.m))]};
const qTx=(ym,n)=>{const b=qBounds(ym,n);return (roMonth(ym).tx||[]).filter(t=>t.f>=b[0]&&t.f<=b[1])};
const allocMonto=(a,base)=>(+a.pct>0)?round2((+base||0)*a.pct/100):(+a.monto||0);
const qBase=(ym,n)=>{const q=roMonth(ym)['q'+n];if(!q)return 0;return (+q.ingreso||0)+sum(qTx(ym,n).filter(t=>t.tipo==='ingreso'),t=>t.monto)};
const sum=(arr,f)=>arr.reduce((s,x)=>s+f(x),0);
function qSummary(ym,n){
  const q=getQ(ym,n),tx=qTx(ym,n);
  const extras=sum(tx.filter(t=>t.tipo==='ingreso'),t=>t.monto);
  const gastos=tx.filter(t=>t.tipo!=='ingreso');
  const cash=gastos.filter(t=>t.medio==='efectivo'||!t.medio);
  const ingreso=(+q.ingreso||0)+extras;
  let asignado=0,over=0;const by={},cats=new Set();
  q.allocs.forEach(a=>{
    const m=allocMonto(a,ingreso);asignado+=m;

}

let SH=null;
function fieldHTML(f,v){

  if(f.type==='select'){const o=typeof f.opts==='function'?f.opts():f.opts;ctl='<select id="'+id+'" data-f="'+f.k+'"'+re+'>'+o.map(x=>'<option value="'+esc(x[0])+'"'+(String(v)===String(x[0])?' selected':'')+'>'+esc(x[1])+'</option>').join('')+'</select>'}

function drawSheet(){
  const c=SH.cfg,vals=SH.vals,root=$('#sheet-root');
  root.innerHTML='<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(c.title)+'"><h2>'+esc(c.title)+'</h2>'+(c.note?'<p class="hint">'+esc(c.note)+'</p>':'')+c.fields.filter(f=>!f.when||f.when(vals)).map(f=>fieldHTML(f,vals[f.k])).join('')+(SH.err?'<p class="err">'+esc(SH.err)+'</p>':'')+'<div class="sheet-actions">'+(c.onDelete?'<button class="btn danger" data-act="sheet-delete">Eliminar</button>':'')+'<span class="grow"></span><button class="btn ghost" data-act="close">Cancelar</button><button class="btn" data-act="sheet-submit">'+esc(c.submit||'Guardar')+'</button></div></div>';
  root.querySelectorAll('[data-f]').forEach(inp=>{
    inp.addEventListener('input',()=>{vals[inp.dataset.f]=inp.value});
    inp.addEventListener('change',()=>{vals[inp.dataset.f]=inp.value;if(inp.dataset.re)drawSheet()});
  });
}
function openForm(cfg){SH={cfg:cfg,vals:Object.assign({},cfg.values),err:''};drawSheet()}
function closeSheet(){SH=null;$('#sheet-root').innerHTML='';if(pendingRender)render()}
function submitSheet(){
  const c=SH.cfg,v=SH.vals;
  for(const f of c.fields){if(f.when&&!f.when(v))continue;if(f.req&&String(v[f.k]==null?'':v[f.k]).trim()===''){SH.err='Falta completar: '+f.label.toLowerCase();drawSheet();return}}
  const out={};c.fields.forEach(f=>{if(f.when&&!f.when(v))return;out[f.k]=(f.type==='number'&&!f.raw)?num(v[f.k]):v[f.k]});

}

      {k:'nombre',label:'Nombre',req:true},
      {k:'kind',label:'Tipo',type:'select',re:true,opts:[['gasto','Gasto con tope (mandado, salidas…)'],['tarjeta','Pago a tarjeta'],['meta','Ahorro o meta'],['diezmo','Diezmo'],['pago','Otro pago (renta, servicio…)']]},
      {k:'ref',label:'Tarjeta',type:'select',opts:()=>[['','Elegir…']].concat(cardOpts()),when:v=>v.kind==='tarjeta'},
      {k:'ref',label:'Meta',type:'select',opts:()=>[['','Elegir…']].concat(S.config.metas.map(m=>[m.id,m.nombre])),when:v=>v.kind==='meta'},
      {k:'cat',label:'Categoría que cuenta contra este tope',type:'select',opts:catOpts,when:v=>v.kind==='gasto'},
      {k:'monto',label:'Monto',type:'number'},
      {k:'pct',label:'O porcentaje del ingreso',type:'number',hint:'Si pones un porcentaje, se usa en lugar del monto.'}
    ],
    onSubmit:o=>{
      const d={nombre:o.nombre.trim(),kind:o.kind,ref:(o.kind==='tarjeta'||o.kind==='meta')?o.ref:'',cat:o.kind==='gasto'?o.cat:'',monto:o.monto,pct:o.pct>0?o.pct:0};
      if(a)Object.assign(a,d);else q.allocs.push(Object.assign({id:uid8(),done:false},d));
      touchMonth(ui.ym);render();
    },
    onDelete:a?()=>{revertAlloc(a);q.allocs=q.allocs.filter(x=>x.id!==a.id);touchMonth(ui.ym);closeSheet();render()}:null
  });
}
function revertAlloc(a){
  if(!a.done)return;
  if(a.kind==='tarjeta'){const c=S.config.tarjetas.find(c=>c.id===a.ref);if(c){c.saldo=round2((+c.saldo||0)+(+a.aplicado||0));touchCfg()}}
  if(a.kind==='meta'){const m=S.config.metas.find(c=>c.id===a.ref);if(m){m.ahorrado=round2((+m.ahorrado||0)-(+a.aplicado||0));touchCfg()}}
}
function toggleAlloc(id){
  const q=getQ(ui.ym,ui.q),a=q.allocs.find(x=>x.id===id);if(!a)return;
  if(!a.done){
    a.done=true;const m=allocMonto(a,qBase(ui.ym,ui.q));a.aplicado=m;
    if(a.kind==='tarjeta'){const c=S.config.tarjetas.find(c=>c.id===a.ref);if(c){const red=Math.min(+c.saldo||0,m);c.saldo=round2((+c.saldo||0)-red);a.aplicado=red;touchCfg()}}
    else if(a.kind==='meta'){const g=S.config.metas.find(c=>c.id===a.ref);if(g){g.ahorrado=round2((+g.ahorrado||0)+m);touchCfg()}}
  }else{revertAlloc(a);a.done=false;delete a.aplicado}
  touchMonth(ui.ym);render();
}

  seed:seedTemplate,
  blank(){S.config=blankConfig();S.config.onboarded=true;touchCfg();render()},
  'q-prev'(){prevQ();render()},'q-next'(){nextQ();render()},
  'g-prev'(){ui.gym=addMonths(ui.gym,-1);render()},'g-next'(){ui.gym=addMonths(ui.gym,1);render()},
  'r-prev'(){ui.rym=addMonths(ui.rym,-1);render()},'r-next'(){ui.rym=addMonths(ui.rym,1);render()},
  'toggle-alloc'(el,e){e.stopPropagation();toggleAlloc(el.dataset.id)},
  'edit-alloc'(el){allocForm(el.dataset.id)},
  'add-alloc'(){allocForm(null)},
  'copy-prev'(){
    const pn=ui.q===2?1:2,pym=ui.q===2?ui.ym:addMonths(ui.ym,-1),pm=roMonth(pym)['q'+pn];
    if(!pm||!pm.allocs.length){toast('La quincena anterior no tiene sobres');return}
    askConfirm('Se reemplazarán los sobres de esta quincena por los de la anterior.','Copiar sobres',()=>{
      const q=getQ(ui.ym,ui.q);q.allocs.forEach(revertAlloc);
      q.allocs=pm.allocs.map(a=>{const c=Object.assign({},a,{id:uid8(),done:false});delete c.aplicado;return c});
      touchMonth(ui.ym);render()});
  },
  'save-template'(){
    askConfirm('Las próximas quincenas nuevas empezarán con estos sobres.','Guardar plantilla',()=>{
      const q=getQ(ui.ym,ui.q);
      S.config.plantilla=q.allocs.map(a=>({id:uid8(),nombre:a.nombre,kind:a.kind,ref:a.ref||'',cat:a.cat||'',monto:a.monto||0,pct:a.pct||0}));
      touchCfg();toast('Plantilla guardada')});
  },
  'add-tx'(){txForm(null,null,ui.route==='gastos'?{f:(ui.gym===ymOf(new Date())?ymd(new Date()):ui.gym+'-01')}:null)},
  'edit-tx'(el){txForm(el.dataset.id,el.dataset.ym)},
  'add-card'(){cardForm(null)},'edit-card'(el){cardForm(el.dataset.id)},
  'card-charge'(el){txForm(null,null,{medio:el.dataset.id})},
  'add-meta'(){metaForm(null)},'edit-meta'(el){metaForm(el.dataset.id)},'meta-add'(el){metaAport(el.dataset.id)},
  'add-fijo'(){fijoForm(null)},'edit-fijo'(el){fijoForm(el.dataset.id)},
  'f-prev'(){ui.fym=addMonths(ui.fym,-1);render()},'f-next'(){ui.fym=addMonths(ui.fym,1);render()},
  'add-extra'(){const b=qBounds(ui.ym,ui.q),t=ymd(new Date());txForm(null,null,{tipo:'ingreso',f:(t>=b[0]&&t<=b[1])?t:b[0]})},
  'fijo-mes'(el,e){
    e.stopPropagation();const f=S.config.fijos.find(x=>x.id===el.dataset.id);if(!f)return;
    openForm({title:f.nombre+' en '+MESES[parseYM(ui.fym).m-1],note:'Escribe lo que realmente pagaste este mes. Déjalo vacío para volver al monto estimado.',values:{monto:(f.vals&&f.vals[ui.fym]!=null)?f.vals[ui.fym]:''},fields:[{k:'monto',label:'Monto real',type:'number',raw:true}],
      onSubmit:o=>{f.vals=f.vals||{};if(String(o.monto==null?'':o.monto).trim()==='')delete f.vals[ui.fym];else f.vals[ui.fym]=num(o.monto);touchCfg();render()}});
  },
  close(){closeSheet()},
  'sheet-submit'(){if(SH)submitSheet()},
  'sheet-delete'(){if(SH&&SH.cfg.onDelete)SH.cfg.onDelete()},
  async export(){
    const data=JSON.stringify({version:1,config:S.config,months:S.months},null,2),fn='mis-finanzas-'+ymd(new Date())+'.json';
    let dl=null;try{if(window.claude&&window.claude.use)dl=await claude.use('downloads')}catch(e){}
    if(dl){try{await dl.save({filename:fn,data:data})}catch(e){if(!e||e.code!=='declined')toast('No se pudo descargar el respaldo')}return}
    try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}catch(e){toast('No se pudo descargar el respaldo')}
  },
  import(){$('#importfile').click()},
  wipe(){askConfirm('Se borrarán tus tarjetas, quincenas, movimientos y metas. Descarga un respaldo antes si quieres conservarlos.','Borrar todo',async()=>{
    const keys=Object.keys(S.months);S.config=blankConfig();S.months={};saveLocal();
    if(DB.db){try{await DB.db.doc(DB.base+'/config').set(clean(S.config));for(const k of keys){try{await DB.db.doc(DB.base+'/m-'+k).delete()}catch(e){}}}catch(e){}}
    ui.route='resumen';render()})}
};
const CHG={
  'q-ingreso'(el){const q=getQ(ui.ym,ui.q);q.ingreso=num(el.value);touchMonth(ui.ym);render()},
  ingresoQ(el){S.config.ingresoQ=num(el.value);touchCfg();toast('Ingreso guardado')},
  tema(el){try{localStorage.setItem('tema-fin',el.value)}catch(e){}applyTheme()}
};
function applyTheme(){let t='auto';try{t=localStorage.getItem('tema-fin')||'auto'}catch(e){}document.documentElement.setAttribute('data-theme',t)}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=ACT[el.dataset.act];if(f){f(el,e)}
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-chg]');if(!el)return;
  const f=CHG[el.dataset.chg];if(f)f(el);
});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pendingRender&&!SH&&!typing())render()},80)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SH)closeSheet()});
$('#importfile').addEventListener('change',e=>{
  const file=e.target.files&&e.target.files[0];e.target.value='';if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);if(!o||!o.config)throw new Error('formato');
      askConfirm('Se reemplazarán los datos actuales por los del respaldo.','Restaurar',()=>{
        S.config=Object.assign(blankConfig(),o.config);S.months=o.months||{};
        dirty.cfg=true;Object.keys(S.months).forEach(k=>dirty.months.add(k));schedulePersist();render();toast('Respaldo restaurado')});
    }catch(err){toast('Ese archivo no parece un respaldo válido')}
  };
  r.readAsText(file);
});

/* ---------- arranque ---------- */
loadLocal();applyTheme();render();initCloud();
})();
</script>
</body>
</html>
